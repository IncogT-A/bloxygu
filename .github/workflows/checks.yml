name: Bloxygu checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Smoke test server and account session
        run: |
          mkdir -p "$RUNNER_TEMP/bloxygu-data"
          DATA_DIR="$RUNNER_TEMP/bloxygu-data" SESSION_SECRET="ci-test-session-secret" PORT=3333 node server.js > "$RUNNER_TEMP/bloxygu-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:3333/api/health > /dev/null; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/bloxygu-server.log"
            exit 1
          fi
          curl --fail http://127.0.0.1:3333/api/health
          touch "$RUNNER_TEMP/bloxygu-cookie.txt"
          curl --fail -c "$RUNNER_TEMP/bloxygu-cookie.txt" -b "$RUNNER_TEMP/bloxygu-cookie.txt" \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser123","password":"testpassword123"}' \
            http://127.0.0.1:3333/api/register
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" http://127.0.0.1:3333/api/me
          curl --fail http://127.0.0.1:3333/api/leaderboard
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" http://127.0.0.1:3333/api/transactions
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" -H "Content-Type: application/json" \
            -d '{"game":"dice","bet":100,"choice":"red"}' \
            http://127.0.0.1:3333/api/game
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" -H "Content-Type: application/json" \
            -d '{"bet":100}' http://127.0.0.1:3333/api/blackjack/start
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" http://127.0.0.1:3333/api/blackjack/state
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" -H "Content-Type: application/json" \
            -d '{"bet":100,"mines":3}' http://127.0.0.1:3333/api/mines/start
          curl --fail -b "$RUNNER_TEMP/bloxygu-cookie.txt" http://127.0.0.1:3333/api/mines/state
